apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-classifier-ingress
  labels:
    app: iris-classifier
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - iris-classifier.example.com
    secretName: iris-classifier-tls
  rules:
  - host: iris-classifier.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iris-classifier-api
            port:
              number: 80
